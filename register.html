<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123e4b">
  <meta name="description" content="罕见病公益多组学科研队列患者信息登记演示页面。">
  <title>患者信息登记｜罕见病公益多组学科研队列</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23123e4b'/%3E%3Cpath d='M17 32h30M32 17v30' stroke='%238ce2d2' stroke-width='7' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='32' r='7' fill='%23fff'/%3E%3C/svg%3E">
  <style>
    :root{font-family:Inter,"Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;color:#203943;background:#f3f7f7;font-synthesis:none}
    *{box-sizing:border-box}
    body{margin:0;min-width:320px}
    button,input,select{font:inherit}
    button{cursor:pointer}
    .page{min-height:100vh;display:grid;grid-template-columns:minmax(340px,42%) minmax(0,1fr)}
    .story{position:relative;overflow:hidden;display:flex;flex-direction:column;padding:42px clamp(32px,5vw,92px) 36px;background:#123e4b;color:#f5fbfa}
    .story::before{content:"";position:absolute;inset:auto -26% -28% auto;width:76%;aspect-ratio:1;border:1px solid #8ce2d244;border-radius:50%;box-shadow:0 0 0 72px #8ce2d20b,0 0 0 144px #8ce2d20b;pointer-events:none}
    .brand{position:relative;display:flex;align-items:center;gap:13px;font-size:15px;font-weight:700;letter-spacing:.02em}
    .brand-mark{display:grid;place-items:center;width:38px;height:38px;border:1px solid #81dccc;border-radius:11px;color:#8ce2d2;font-size:28px;font-weight:300;line-height:1}
    .story-main{position:relative;margin:auto 0;max-width:520px;padding:80px 0}
    .eyebrow{display:flex;align-items:center;gap:12px;color:#8ce2d2;font-size:13px;font-weight:700;letter-spacing:.18em}
    .eyebrow::before{content:"";width:32px;height:1px;background:currentColor}
    h1{margin:24px 0 23px;font-size:clamp(39px,4.3vw,68px);line-height:1.16;letter-spacing:-.045em;font-weight:700}
    .story-main p{max-width:440px;margin:0;color:#c4d8db;font-size:16px;line-height:1.9}
    .steps{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:520px;padding-top:21px;border-top:1px solid #5c8189}
    .step{font-size:13px;color:#c4d8db;line-height:1.45}
    .step strong{display:block;margin-bottom:7px;color:#8ce2d2;font-size:13px;letter-spacing:.1em}
    .form-side{display:flex;justify-content:center;align-items:center;padding:56px clamp(24px,5vw,90px)}
    .form-wrap{width:min(100%,640px)}
    .back{display:inline-block;margin-bottom:22px;color:#397a7d;font-size:14px;font-weight:650;text-decoration:none}
    .back:hover{text-decoration:underline}
    .back:focus-visible{outline:3px solid #86d8d1;outline-offset:4px}
    .form-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:25px}
    .form-head small{display:block;margin-bottom:9px;color:#3c777c;font-size:13px;font-weight:700;letter-spacing:.12em}
    h2{margin:0;color:#183c45;font-size:clamp(27px,2.5vw,35px);line-height:1.28;letter-spacing:-.035em}
    .badge{flex:none;padding:8px 12px;border:1px solid #bbdbd7;border-radius:999px;background:#e8f4f0;color:#2f7771;font-size:12px;font-weight:700}
    .notice{display:flex;gap:12px;margin-bottom:24px;padding:15px 17px;border:1px solid #d3e4e5;border-radius:13px;background:#e9f2f3;color:#3b5f67;font-size:14px;line-height:1.65}
    .notice-icon{display:grid;place-items:center;flex:none;width:21px;height:21px;border:1.5px solid #4b8791;border-radius:50%;color:#3d7882;font-size:13px;font-weight:700}
    .notice p{margin:0}
    form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 18px}
    .field{min-width:0}
    .field.wide{grid-column:1/-1}
    label{display:block;margin-bottom:9px;color:#29464e;font-size:14px;font-weight:650}
    label span{color:#c66a54}
    input,select{width:100%;height:48px;padding:0 14px;border:1px solid #cbdadb;border-radius:10px;outline:none;background:#fff;color:#203943;font-size:15px;transition:border-color .2s,box-shadow .2s}
    input::placeholder{color:#96a8ac}
    input:focus,select:focus{border-color:#2e8c8c;box-shadow:0 0 0 3px #2e8c8c22}
    input:invalid:not(:placeholder-shown){border-color:#ca8273}
    .hint{margin:7px 0 0;color:#748e94;font-size:12px;line-height:1.5}
    .submit-row{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:18px;margin-top:9px}
    .submit-note{margin:0;color:#738c91;font-size:12px;line-height:1.55}
    .submit{flex:none;min-width:186px;min-height:50px;padding:12px 21px;border:0;border-radius:10px;background:#147f82;color:#fff;font-size:15px;font-weight:700;box-shadow:0 9px 20px #147f8227;transition:background .2s,transform .2s}
    .submit:hover{background:#106b6f;transform:translateY(-1px)}
    .submit:focus-visible{outline:3px solid #86d8d1;outline-offset:3px}
    .feedback{grid-column:1/-1;margin:0;padding:14px 16px;border-radius:10px;background:#e6f5ed;color:#27694a;font-size:14px;line-height:1.6}
    .feedback[hidden]{display:none}
    @media(max-width:950px){.page{grid-template-columns:1fr}.story{padding:24px 32px}.story-main{padding:32px 0 10px}.story-main p{max-width:650px}.steps{display:none}.form-side{padding:34px 32px 70px}}
    @media(max-width:640px){.story{padding:20px}.brand{font-size:13px}.story-main{padding:20px 0 0}h1{margin:10px 0;font-size:29px;line-height:1.3}.story-main p{font-size:14px;line-height:1.6}.form-side{padding:30px 20px 60px}.form-head{align-items:center}.badge{font-size:11px;padding:7px 9px}form{grid-template-columns:1fr;gap:16px}.field.wide{grid-column:auto}.submit-row{display:block;grid-column:auto}.submit-note{margin-bottom:14px}.submit{width:100%}.feedback{grid-column:auto}}
    @media(prefers-reduced-motion:reduce){input,select,.submit{transition:none}}
  </style>
</head>
<body>
  <main class="page">
    <section class="story" aria-labelledby="site-title">
      <div class="brand"><span class="brand-mark" aria-hidden="true">＋</span><span>罕见病公益多组学科研队列</span></div>
      <div class="story-main">
        <div class="eyebrow">PATIENT REGISTRATION</div>
        <h1 id="site-title">让每一份信息，<br>成为研究的起点。</h1>
        <p>请填写患者基本信息与采样情况，完成科研队列信息登记。整个过程大约需要 2 分钟。</p>
      </div>
      <div class="steps" aria-label="登记流程">
        <div class="step"><strong>01</strong>填写基本信息</div>
        <div class="step"><strong>02</strong>补充采样情况</div>
        <div class="step"><strong>03</strong>核对后提交</div>
      </div>
    </section>
    <section class="form-side" aria-labelledby="form-title">
      <div class="form-wrap">
        <a class="back" href="./">← 返回首页</a>
        <div class="form-head"><div><small>队列登记 / 01</small><h2 id="form-title">患者信息登记</h2></div><span class="badge">前端演示</span></div>
        <div class="notice" role="note"><span class="notice-icon" aria-hidden="true">i</span><p>当前为演示页面。填写内容不会上传或保存，请勿输入真实的身份证号码或其他敏感信息。</p></div>
        <form id="patient-form" autocomplete="off">
          <div class="field"><label for="name">姓名 <span aria-hidden="true">*</span></label><input id="name" name="name" type="text" placeholder="请输入姓名" maxlength="50" required></div>
          <div class="field"><label for="contact">联系方式 <span aria-hidden="true">*</span></label><input id="contact" name="contact" type="tel" inputmode="tel" placeholder="请输入手机或联系电话" maxlength="30" required></div>
          <div class="field"><label for="email">邮箱 <span aria-hidden="true">*</span></label><input id="email" name="email" type="email" placeholder="name@example.com" maxlength="254" required></div>
          <div class="field"><label for="id-card">身份证号码 <span aria-hidden="true">*</span></label><input id="id-card" name="idCard" type="text" inputmode="text" placeholder="请输入 18 位身份证号码" minlength="18" maxlength="18" pattern="[0-9]{17}[0-9Xx]" title="请输入 18 位中国居民身份证号码" required></div>
          <div class="field"><label for="disease">病种 <span aria-hidden="true">*</span></label><input id="disease" name="disease" type="text" placeholder="例如：肌萎缩侧索硬化症" maxlength="100" required></div>
          <div class="field"><label for="tissue">组织类型 <span aria-hidden="true">*</span></label><select id="tissue" name="tissue" required><option value="" selected disabled>请选择组织类型</option><option>外周血</option><option>血清</option><option>血浆</option><option>唾液</option><option>皮肤组织</option><option>肌肉组织</option><option>其他</option></select></div>
          <div class="field wide"><label for="sample-date">采样时间 <span aria-hidden="true">*</span></label><input id="sample-date" name="sampleDate" type="date" required><p class="hint">请选择实际采样日期</p></div>
          <div class="submit-row"><p class="submit-note">带 * 的项目均需填写。点击提交仅演示表单反馈。</p><button class="submit" type="submit">提交信息（演示）</button></div>
          <p class="feedback" id="feedback" role="status" aria-live="polite" hidden>演示提交成功。信息未上传或保存，感谢体验。</p>
        </form>
      </div>
    </section>
  </main>
  <script>
    const form = document.getElementById('patient-form');
    const feedback = document.getElementById('feedback');
    const sampleDate = document.getElementById('sample-date');
    const today = new Date();
    sampleDate.max = new Date(today.getTime() - today.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
    form.addEventListener('submit', (event) => {
      event.preventDefault();
      feedback.hidden = false;
      form.reset();
      feedback.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    });
    form.addEventListener('input', () => { feedback.hidden = true; });
  </script>
</body>
</html>
